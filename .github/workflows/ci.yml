name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false      # one runner's result shouldn't cancel the other
      matrix:
        # GitHub retired the macos-14 image on 2026-11-02. The macOS 14 minimum
        # deployment target (Package targets .macOS(.v14)) is still enforced at
        # compile time by the SDK's availability checks on any newer runner.
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: swift build -c release
      - run: swift test
      # Smoke: the CLI path must never touch AppKit (no window flash, clean exit).
      - run: .build/release/labelkit --version
      # Smoke: `detect` is wired and stays headless (no AppKit, no Vision here):
      # help prints, and the missing-file path validates and exits 64 before any
      # detector runs.
      - name: Smoke-test `labelkit detect` stays headless
        run: |
          .build/release/labelkit detect --help >/dev/null
          if .build/release/labelkit detect /nonexistent.jpg --detector rectangles; then
            echo "expected a usage error"; exit 1
          else
            test $? -eq 64
          fi
      # Smoke: `train` is wired and stays headless (no AppKit, and no CreateML
      # training kicks off): help prints, and a dataset with no annotations
      # validates and exits 64 before any training starts.
      - name: Smoke-test `labelkit train` stays headless
        run: |
          .build/release/labelkit train --help >/dev/null
          empty="$(mktemp -d)"
          if .build/release/labelkit train "$empty"; then
            echo "expected a usage error"; exit 1
          else
            test $? -eq 64
          fi
